<!-- dnd-shared head v1.4. Put these right after the <meta name="description"> line on every page.
     Replace SITE TITLE, DESCRIPTION, PAGE URL (the full live URL of this page) and SITE URL (the site root,
     e.g. https://wernercd.github.io/dnd-items/). Icons, og.png and manifest come from shared/images/<repo>/ (STYLE 6h). -->
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171a" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="PAGE URL">
<meta property="og:type" content="website">
<meta property="og:site_name" content="D&amp;D Toolbox">
<meta property="og:title" content="SITE TITLE">
<meta property="og:description" content="DESCRIPTION">
<meta property="og:url" content="PAGE URL">
<meta property="og:image" content="SITE URLog.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
